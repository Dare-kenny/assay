name: CI

# Proves, on every push and pull request, that the committed raw data rebuilds
# to the committed outputs and that the site builds from them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rebuild offline, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Recompute every number from committed raw data
        run: npm run rebuild:offline
      - name: Outputs are reproducible
        # generatedAt is the only field allowed to differ between two runs on the same raw data
        run: |
          git diff --stat
          if ! git diff --quiet -I'"generatedAt"' -I'^Generated by' -- data/series.json THESIS.md data/metrics.json; then
            echo "::error::Recomputing from data/raw/ changed the outputs. Commit the regenerated files."
            git diff -I'"generatedAt"' -I'^Generated by' -- THESIS.md | head -80
            exit 1
          fi
      - name: Build the static site
        run: npm run build
      - name: Every page was exported
        run: |
          for p in index.html evidence/index.html model/index.html verify/index.html thesis/index.html; do
            test -s "out/$p" || { echo "::error::missing out/$p"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
